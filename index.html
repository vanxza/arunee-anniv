<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Beau+Rivage&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --wine-950:#2a0d16;
  --wine-800:#4a1626;
  --wine-600:#7c2438;
  --blush-300:#f3cdd4;
  --cream-100:#fbf3ee;
  --gold-400:#d8b587;
  --ink:#2a0d16;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Cormorant Garamond', serif;
  color:var(--cream-100);
  background:var(--wine-950);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* Background photo */
#bg-photo{
  position:fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:0;
  filter:saturate(0.9);
}
#bg-tint{
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(216,181,135,0.18), transparent 45%),
    linear-gradient(180deg, rgba(42,13,22,0.55), rgba(42,13,22,0.88));
  z-index:1;
}

#app{
  position:relative; z-index:2;
  height:100vh; height:100dvh;
  width:100%;
  padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}

.screen{
  position:absolute; inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:32px 20px;
  opacity:0;
  transition:opacity .5s ease;
}
.screen.active{ display:flex; opacity:1; }

h1.title{
  font-family:'Beau Rivage', cursive;
  font-weight:400;
  font-size:clamp(2.4rem, 8vw, 4rem);
  margin:0 0 6px;
  line-height:1.1;
  color:var(--cream-100);
}
p.subtitle{
  font-size:clamp(1rem,3vw,1.25rem);
  letter-spacing:.03em;
  color:var(--blush-300);
  margin:0 0 40px;
  font-style:italic;
}

/* ---------------- Envelope ---------------- */
.envelope-wrap{ cursor:pointer; user-select:none; }
.envelope{
  position:relative;
  width:min(70vw,260px);
  height:min(46vw,180px);
  margin:0 auto;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.4));
}
.env-base{
  position:absolute; inset:0;
  background:#8f1414;
  border-radius:4px;
}
.env-tri{ position:absolute; inset:0; }
.env-tri-left{  clip-path:polygon(0 0, 0 100%, 50% 55%);  background:#a81f1f; }
.env-tri-right{ clip-path:polygon(100% 0, 100% 100%, 50% 55%); background:#8f1919; }
.env-tri-bottom{clip-path:polygon(0 100%, 100% 100%, 50% 55%); background:#7c1414; border-radius:0 0 4px 4px; }
.env-flap{
  position:absolute; inset:0;
  clip-path:polygon(0 0, 100% 0, 50% 55%);
  background:linear-gradient(160deg,#e35a5a,#c22f2f);
  transform-origin:top center;
  transition:transform .7s cubic-bezier(.6,-0.2,.3,1.2);
  z-index:3;
  border-radius:4px 4px 0 0;
}
.envelope.open .env-flap{ transform:rotateX(180deg); }
.seal{
  position:absolute; top:55%; left:50%;
  width:46px; height:46px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%, var(--gold-400), #a97a3c);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; color:#5c1a2b;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
  z-index:4;
  transition:opacity .3s ease, transform .3s ease;
}
.envelope.open .seal{ opacity:0; transform:translate(-50%,-50%) scale(.4); }

/* photo10 inside the envelope peek */
.letter-peek{
  position:absolute; left:8%; right:8%; top:6%;
  height:78%;
  background:var(--cream-100);
  border-radius:6px;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  transform:translateY(0);
  transition:transform .6s ease .15s;
  z-index:2;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px;
}
.letter-peek img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:4px;
}
.envelope.open .letter-peek{ transform:translateY(-42%); }
.tap-hint{
  margin-top:26px;
  font-family:'Jost',sans-serif;
  font-size:.85rem;
  letter-spacing:.12em;
  color:var(--blush-300);
  opacity:.85;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:.5} 50%{opacity:1} }

/* ---------------- Lock Screen ---------------- */
.lock-card{
  background:rgba(251,243,238,0.08);
  border:1px solid rgba(216,181,135,.35);
  backdrop-filter:blur(6px);
  border-radius:22px;
  padding:26px 22px;
  width:min(88vw,320px);
}
.code-display{
  display:flex; gap:14px; justify-content:center;
  margin-bottom:22px;
}
.code-dot{
  width:16px; height:16px; border-radius:50%;
  border:1.5px solid var(--gold-400);
  background:transparent;
  transition:background .2s ease;
}
.code-dot.filled{ background:var(--gold-400); }
.code-dot.shake{ animation:shake .4s; }
@keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

.numpad{
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.num-btn{
  font-family:'Jost',sans-serif;
  font-size:1.15rem;
  color:var(--wine-800);
  background:linear-gradient(160deg,#fff,var(--blush-300));
  border:none; border-radius:14px;
  aspect-ratio:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,.25);
  transition:transform .1s ease;
}
.num-btn:active{ transform:scale(.92); }
.num-btn.ghost{ background:transparent; box-shadow:none; color:var(--blush-300); font-size:.85rem; font-family:'Jost',sans-serif;}

/* ---------------- Menu with Photo Icons & Zoom Effect ---------------- */
.menu-grid{
  display:flex; gap:clamp(18px,6vw,44px);
  flex-wrap:wrap; justify-content:center;
  max-width:520px;
}
.menu-item{
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  width:110px;
}
.menu-icon-img{
  width:84px; height:84px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--gold-400);
  box-shadow:0 6px 16px rgba(0,0,0,0.35);
  transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease;
  animation:gentleFloat 2.8s ease-in-out infinite;
}

/* Individual slight float delays for movement */
.menu-item:nth-child(1) .menu-icon-img{ animation-delay:0s; }
.menu-item:nth-child(2) .menu-icon-img{ animation-delay:0.4s; }
.menu-item:nth-child(3) .menu-icon-img{ animation-delay:0.8s; }

/* Floating animation movement */
@keyframes gentleFloat{
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-8px) rotate(2deg); }
}

/* Hover and Click / Zoom Effect */
.menu-item:hover .menu-icon-img{
  transform: scale(1.1) translateY(-4deg);
  border-color: #fff;
}
.menu-item:active .menu-icon-img{
  transform: scale(1.18);
}

.menu-label{
  font-family:'Jost',sans-serif;
  font-size:.85rem;
  letter-spacing:.04em;
  color:var(--blush-300);
}

/* ---------------- Sub-Screens ---------------- */
.back-btn{
  position:absolute; top:22px; left:18px;
  width:42px; height:42px;
  border-radius:50%;
  background:rgba(251,243,238,.12);
  border:1px solid rgba(216,181,135,.4);
  color:var(--cream-100);
  font-size:1.1rem;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  z-index:5;
}
.sub-scroll{
  width:100%; height:100%;
  overflow-y:auto;
  padding:80px 24px 40px;
  display:flex; flex-direction:column; align-items:center;
}
.letter-box{
  max-width:560px;
  font-size:clamp(1.05rem,2.6vw,1.3rem);
  line-height:1.7;
  text-align:left;
  white-space:pre-line;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  max-width:520px;
  width:100%;
}
.polaroid{
  background:var(--cream-100);
  padding:10px 10px 26px;
  border-radius:4px;
  box-shadow:0 10px 20px rgba(0,0,0,.35);
  animation:sway 3.4s ease-in-out infinite;
  animation-delay:var(--d,0s);
}
@keyframes sway{
  0%,100%{ transform:rotate(var(--r,0deg)); }
  50%{ transform:rotate(calc(var(--r,0deg) * -1)) translateY(-6px); }
}
.polaroid img{
  width:100%; aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  border-radius:2px;
}
.polaroid figcaption{
  display:none;
  font-family:'Jost',sans-serif;
  color:var(--ink);
  font-size:.7rem;
  text-align:center;
  margin-top:8px;
  letter-spacing:.03em;
}
.song-embed{
  width:100%; max-width:420px;
  aspect-ratio:16/9;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 14px 30px rgba(0,0,0,.4);
  margin-top:10px;
}
.song-embed iframe{ width:100%; height:100%; border:0; }
.vinyl{
  width:120px; height:120px; border-radius:50%;
  background:repeating-radial-gradient(circle at center,#111 0 3px,#000 3px 6px);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:18px;
  animation:spin 6s linear infinite, bob 2.2s ease-in-out infinite;
  box-shadow:0 10px 24px rgba(0,0,0,.4);
}
@keyframes bob{ 0%,100%{ margin-top:0; } 50%{ margin-top:-10px; } }
.vinyl::after{
  content:"";
  width:34px; height:34px; border-radius:50%;
  background:var(--wine-600);
}
@keyframes spin{ to{ transform:rotate(360deg);} }

.heart-burst{ position:fixed; inset:0; pointer-events:none; z-index:6; overflow:hidden; }
.heart-burst span{
  position:absolute; bottom:-10%;
  font-size:1.4rem;
  color:var(--blush-300);
  opacity:.9;
  animation:rise 3.2s ease-in forwards;
}
@keyframes rise{
  to{ transform:translateY(-115vh) rotate(20deg); opacity:0; }
}

::-webkit-scrollbar{ width:0; }
</style>
</head>
<body>

<img id="bg-photo" src="images/photo1.jpg" alt="Our photo">
<div id="bg-tint"></div>

<div id="app">

  <!-- 1. HERO -->
  <section class="screen active" id="screen-hero">
    <h1 class="title" id="hero-title">Happy Anniversary</h1>
    <p class="subtitle" id="hero-subtitle">Another chapter down, forever to go</p>
    <div class="envelope-wrap" id="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="env-base"></div>
        <div class="env-tri env-tri-left"></div>
        <div class="env-tri env-tri-right"></div>
        <div class="env-tri env-tri-bottom"></div>
        <div class="letter-peek">
          <!-- Envelope opening photo: photo10.jpg -->
          <img src="images/photo10.jpg" alt="Inside Envelope Photo" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'300\'%3E%3Crect width=\'100%25\' height=\'100%25\' fill=\'%23f3cdd4\'/%3E%3Ctext x=\'50%25\' y=\'50%25\' font-size=\'16\' fill=\'%232a0d16\' text-anchor=\'middle\' dy=\'.3em\'%3Ephoto10.jpg%3C/text%3E%3C/svg%3E'">
        </div>
        <div class="env-flap"></div>
        <div class="seal">&#9825;</div>
      </div>
    </div>
    <div class="tap-hint">tap the envelope</div>
  </section>

  <!-- 2. LOCK -->
  <section class="screen" id="screen-lock">
    <h1 class="title" style="font-size:clamp(1.8rem,6vw,2.6rem)">Happy Anniversary, Love! ❤️</h1>
    <p class="subtitle" id="lock-hint">Enter the date it all began</p>
    <div class="lock-card">
      <div class="code-display" id="code-display"></div>
      <div class="numpad" id="numpad"></div>
    </div>
  </section>

  <!-- 3. MENU (Icons: photo7.jpg, photo8.jpg, photo9.jpg) -->
  <section class="screen" id="screen-menu">
    <h1 class="title" id="menu-title">Happy Anniversary</h1>
    <p class="subtitle" id="menu-subtitle">Another chapter down, forever to go</p>
    <div class="menu-grid">
      <!-- Icon 1: photo7.jpg -->
      <div class="menu-item" data-target="screen-gallery">
        <img class="menu-icon-img" src="images/photo7.jpg" alt="Photo 7" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'%3E%3Crect width=\'100%25\' height=\'100%25\' fill=\'%23f3cdd4\'/%3E%3Ctext x=\'50%25\' y=\'50%25\' font-size=\'12\' fill=\'%232a0d16\' text-anchor=\'middle\' dy=\'.3em\'%3Ephoto7.jpg%3C/text%3E%3C/svg%3E'">
        <div class="menu-label">Our photos</div>
      </div>
      <!-- Icon 2: photo8.jpg -->
      <div class="menu-item" data-target="screen-letter">
        <img class="menu-icon-img" src="images/photo8.jpg" alt="Photo 8" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'%3E%3Crect width=\'100%25\' height=\'100%25\' fill=\'%23f3cdd4\'/%3E%3Ctext x=\'50%25\' y=\'50%25\' font-size=\'12\' fill=\'%232a0d16\' text-anchor=\'middle\' dy=\'.3em\'%3Ephoto8.jpg%3C/text%3E%3C/svg%3E'">
        <div class="menu-label">My letter</div>
      </div>
      <!-- Icon 3: photo9.jpg -->
      <div class="menu-item" data-target="screen-song">
        <img class="menu-icon-img" src="images/photo9.jpg" alt="Photo 9" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'%3E%3Crect width=\'100%25\' height=\'100%25\' fill=\'%23f3cdd4\'/%3E%3Ctext x=\'50%25\' y=\'50%25\' font-size=\'12\' fill=\'%232a0d16\' text-anchor=\'middle\' dy=\'.3em\'%3Ephoto9.jpg%3C/text%3E%3C/svg%3E'">
        <div class="menu-label">Our song</div>
      </div>
    </div>
  </section>

  <!-- 4. LETTER -->
  <section class="screen" id="screen-letter">
    <div class="back-btn" data-back="screen-menu">&#8592;</div>
    <div class="sub-scroll">
      <h1 class="title" style="font-size:clamp(1.6rem,5vw,2.2rem)">My love letter</h1>
      <div class="letter-box" id="letter-text"></div>
    </div>
  </section>

  <!-- 5. GALLERY -->
  <section class="screen" id="screen-gallery">
    <div class="back-btn" data-back="screen-menu">&#8592;</div>
    <div class="sub-scroll">
      <h1 class="title" style="font-size:clamp(1.6rem,5vw,2.2rem)">Our photos</h1>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <!-- 6. SONG -->
  <section class="screen" id="screen-song">
    <div class="back-btn" data-back="screen-menu">&#8592;</div>
    <h1 class="title" id="song-title" style="font-size:clamp(1.6rem,5vw,2.2rem)">This song is for you</h1>
    <div class="vinyl"></div>
    <div class="song-embed" id="song-embed"></div>
  </section>

</div>

<script>
const CONFIG = {
  title: "Happy Anniversary, My Love",
  subtitle: "Another chapter down, forever to go",
  passcode: "092625",
  lockHint: "Enter the date it all began",

  letter:
`Happy anniversary, love! What an amazing year it has been with you, through all the ups and downs. Cheers to more years together! I love you so, so much.

I hope you’re always safe and doing well. Time really flies so fast, huh? It feels like just yesterday, and now we’re already celebrating another year together.

I’m so proud of how much you’ve grown and improved throughout this year. I’ve seen how hard you’ve worked, how you’ve handled everything, and how you’ve kept going even when things weren’t easy. I’m really proud of the person you’re becoming.

Thank you for staying with me through everything, for loving me, and for being part of my life. I’m grateful for every memory we’ve made, every laugh, every late-night call, and even the difficult moments because they helped us grow together.

I hope we continue to choose each other, understand each other, and grow together. No matter what happens, I’ll always be rooting for you and supporting you. Here’s to more memories, more adventures, more laughs, and more years with you.

I love you always, love. Happy anniversary!`,

  photos: [
    { src: "images/photo2.jpg", caption: "" },
    { src: "images/photo3.jpg", caption: "" },
    { src: "images/photo4.jpg", caption: "" },
    { src: "images/photo5.jpg", caption: "" },
    { src: "images/photo6.jpg", caption: "" }
  ],

  /* SONG RECOMMENDATIONS FOR BEING IN LOVE:
     1. "Lover" - Taylor Swift (https://www.youtube.com/watch?v=-BjZmE2gTDo)
     2. "Until I Found You" - Stephen Sanchez (https://www.youtube.com/watch?v=GxldQ9eX2fc)
     3. "Perfect" - Ed Sheeran (https://www.youtube.com/watch?v=2Vv-BfVoq4g)
     4. "Die With A Smile" - Lady Gaga & Bruno Mars (https://www.youtube.com/watch?v=kPa7bsKwL-c)
  */
  songTitle: "Lover - Taylor Swift",
  songEmbedType: "youtube",
  songYouTubeUrl: "https://www.youtube.com/watch?v=-BjZmE2gTDo",
  songAudioSrc: ""
};

document.getElementById('hero-title').textContent = CONFIG.title;
document.getElementById('hero-subtitle').textContent = CONFIG.subtitle;
document.getElementById('menu-title').textContent = CONFIG.title;
document.getElementById('menu-subtitle').textContent = CONFIG.subtitle;
document.getElementById('lock-hint').textContent = CONFIG.lockHint;
document.getElementById('letter-text').textContent = CONFIG.letter;
document.getElementById('song-title').textContent = CONFIG.songTitle;

// Gallery Setup
const galleryGrid = document.getElementById('gallery-grid');
CONFIG.photos.forEach((p,i)=>{
  const fig = document.createElement('figure');
  fig.className = 'polaroid';
  fig.style.setProperty('--r', (i%2===0?-3:3)+'deg');
  fig.style.setProperty('--d', (i*0.2)+'s');
  const placeholder = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300'%3E%3Crect width='100%25' height='100%25' fill='%23e7d5cb'/%3E%3Ctext x='50%25' y='50%25' font-size='16' fill='%23a98' text-anchor='middle' dy='.3em'%3Eyour photo%3C/text%3E%3C/svg%3E";
  fig.innerHTML = `<img src="${p.src || placeholder}" alt="${p.caption||''}" onerror="this.src='${placeholder}'"><figcaption>${p.caption||''}</figcaption>`;
  galleryGrid.appendChild(fig);
});

// Song Setup
function youtubeId(url){
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const songEmbed = document.getElementById('song-embed');
if(CONFIG.songEmbedType === 'youtube'){
  const id = youtubeId(CONFIG.songYouTubeUrl);
  songEmbed.innerHTML = id
    ? `<iframe src="https://www.youtube.com/embed/${id}" title="song" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    : `<p style="font-family:'Jost',sans-serif;font-size:.85rem;color:var(--blush-300)">Add a YouTube link in CONFIG.songYouTubeUrl</p>`;
} else {
  songEmbed.style.aspectRatio = 'auto';
  songEmbed.innerHTML = `<audio controls style="width:100%" src="${CONFIG.songAudioSrc}"></audio>`;
}

// Navigation
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.querySelectorAll('.menu-item').forEach(item=>{
  item.addEventListener('click', ()=> showScreen(item.dataset.target));
});
document.querySelectorAll('.back-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> showScreen(btn.dataset.back));
});

// Envelope click
const envelope = document.getElementById('envelope');
document.getElementById('envelope-wrap').addEventListener('click', ()=>{
  if(envelope.classList.contains('open')) return;
  envelope.classList.add('open');
  setTimeout(()=> showScreen('screen-lock'), 900);
});

// Passcode Numpad
let entered = "";
const numpad = document.getElementById('numpad');
const codeDisplay = document.getElementById('code-display');

function renderDots(){
  codeDisplay.innerHTML = "";
  const len = CONFIG.passcode.length;
  for(let i=0;i<len;i++){
    const dot = document.createElement('div');
    dot.className = 'code-dot' + (i < entered.length ? ' filled' : '');
    codeDisplay.appendChild(dot);
  }
}
function shakeDots(){
  document.querySelectorAll('.code-dot').forEach(d=>d.classList.add('shake'));
  setTimeout(()=>document.querySelectorAll('.code-dot').forEach(d=>d.classList.remove('shake')), 400);
}
function heartCelebration(){
  const burst = document.createElement('div');
  burst.className = 'heart-burst';
  document.body.appendChild(burst);
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    s.textContent = '♥';
    s.style.left = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*1.2)+'s';
    s.style.fontSize = (1+Math.random()*1.4)+'rem';
    burst.appendChild(s);
  }
  setTimeout(()=>burst.remove(), 3600);
}

const digits = ['1','2','3','4','5','6','7','8','9','','0','back'];
digits.forEach(d=>{
  const btn = document.createElement('button');
  if(d === ''){ btn.className='num-btn'; btn.style.visibility='hidden'; }
  else if(d === 'back'){
    btn.className = 'num-btn ghost';
    btn.textContent = 'clear';
    btn.addEventListener('click', ()=>{ entered = entered.slice(0,-1); renderDots(); });
  } else {
    btn.className = 'num-btn';
    btn.textContent = d;
    btn.addEventListener('click', ()=>{
      if(entered.length >= CONFIG.passcode.length) return;
      entered += d;
      renderDots();
      if(entered.length === CONFIG.passcode.length){
        if(entered === CONFIG.passcode){
          heartCelebration();
          setTimeout(()=> showScreen('screen-menu'), 500);
        } else {
          shakeDots();
          setTimeout(()=>{ entered = ""; renderDots(); }, 500);
        }
      }
    });
  }
  numpad.appendChild(btn);
});
renderDots();
</script>
</body>
</html>
